# ========================================
# 7B CRAFT V3 GRPO, offline 8-GPU node profile.
# Identical to v1 except: dataset → v2 messages, template_version=v2,
# output_dir suffixed with -V2.
# ========================================

model: Qwen/Qwen2.5-7B-Instruct
model_revision: main
torch_dtype: bfloat16
attn_impl: flash_attn
tuner_type: full
use_hf: true

dataset: data/train/grpo/grpo_20000_v3_messages.jsonl
dataset_num_proc: 8
max_length: 8192
vllm_mode: 'colocate'
sleep_level: 1

rlhf_type: grpo
beta: 0.04
epsilon: 0.2

reward_funcs:
  - format_reward
  - accuracy_reward
  - judge_overall_consistency_reward

reward_weights:
  - 1.0
  - 1.0
  - 1.0

template_version: v3
judge_model: Qwen/Qwen3-30B-A3B-Instruct-2507
batch_reward_workers: 64

num_beams: 1
temperature: 1.0
top_k: 20
top_p: 0.9
repetition_penalty: 1.0
max_new_tokens: 512
max_completion_length: 512
num_generations: 8
num_sample_generations: 4

bf16: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
num_train_epochs: 1
max_steps: 312
warmup_ratio: 0.1
learning_rate: 3.0e-6
lr_scheduler_type: cosine
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 16
max_grad_norm: 1.0
weight_decay: 0.0

do_eval: false
eval_strategy: 'no'

use_vllm: true
vllm_tensor_parallel_size: 2
vllm_gpu_memory_utilization: 0.25
vllm_max_model_len: 8192
vllm_enable_prefix_caching: true

deepspeed: cfg/deepspeed/ds_config_zero3_offload.json

output_dir: checkpoints/Qwen2.5-7B-Instruct-GRPO-Judge-Offline8GPU-V3-20k
overwrite_output_dir: true
logging_steps: 1
logging_first_step: true
logging_strategy: steps
log_level: info
log_completions: true
save_strategy: steps
save_steps: 30
save_total_limit: 2
report_to:
  - tensorboard

seed: 42
dataloader_num_workers: 4
dataloader_pin_memory: true
ddp_find_unused_parameters: false
push_to_hub: false
load_from_cache_file: false
