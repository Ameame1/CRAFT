# 1.5B GRPO — balanced (1,1,1,1) control, 100 steps only
# Confirms the directional comparison vs faith-heavy / answer-heavy is clean.

model: Qwen/Qwen2.5-1.5B-Instruct
model_revision: main
torch_dtype: bfloat16
attn_impl: flash_attn
tuner_type: full
use_hf: true

dataset: data/train/grpo/grpo_25000_v1_messages.jsonl
dataset_num_proc: 8
max_length: 8192
vllm_mode: 'colocate'
vllm_tensor_parallel_size: 1
sleep_level: 1

rlhf_type: grpo

reward_funcs:
  - format_reward
  - accuracy_reward
  - judge_overall_consistency_reward
  - relevance_reward

reward_weights:
  - 1.0
  - 1.0
  - 1.0
  - 1.0

template_version: v1
batch_reward_workers: 32
judge_model: Qwen/Qwen3-30B-A3B-Instruct-2507

num_beams: 1
temperature: 1.0
top_k: 20
top_p: 0.9
repetition_penalty: 1.0
max_new_tokens: 256
num_sample_generations: 4
num_generations: 8

bf16: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
num_train_epochs: 1
max_steps: 100
warmup_ratio: 0.1
learning_rate: 5.0e-6
lr_scheduler_type: cosine
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 32
max_grad_norm: 1.0
weight_decay: 0.0

do_eval: false
eval_strategy: 'no'

use_vllm: true
vllm_gpu_memory_utilization: 0.15
vllm_max_model_len: 8192

deepspeed: cfg/deepspeed/ds_config_zero2.json

output_dir: checkpoints/Qwen2.5-1.5B-Instruct-GRPO-BalancedShort
overwrite_output_dir: true
logging_steps: 1
logging_first_step: true
logging_strategy: steps
log_level: info
log_completions: false
save_strategy: steps
save_steps: 50
save_total_limit: 1
report_to:
  - tensorboard

seed: 42
dataloader_num_workers: 4
dataloader_pin_memory: true
ddp_find_unused_parameters: false
push_to_hub: false
load_from_cache_file: false
