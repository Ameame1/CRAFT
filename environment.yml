name: craft
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12

  # System-level dependencies
  - cmake
  - git
  - git-lfs

  # Core scientific computing (Torch installed via pip below for cu128 wheels)
  - scipy>=1.11.0
  - numpy>=1.24.0

  - pip
  - pip:
    # PyTorch 2.9.1 + CUDA 12.8 (official wheel index)
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - torch==2.9.1
    - torchvision==0.24.1
    - triton==3.5.1

    # Transformers ecosystem
    - transformers==4.57.6
    - datasets>=2.16.0
    - accelerate>=0.26.0
    - peft>=0.8.0

    # Training framework
    - ms-swift==4.1.3

    # Inference
    - vllm==0.16.0
    - openai>=1.12.0

    # Distributed training
    - deepspeed>=0.14.0

    # Configuration and utilities
    - pyyaml>=6.0
    - python-dotenv>=1.0.0
    - loguru>=0.7.0
    - tqdm>=4.65.0

    # Data processing
    - gdown>=5.0.0
    - requests>=2.31.0

# Post-install instructions:
# 1. Install Flash Attention 2.8.3 (requires CUDA toolchain + matching torch):
#    pip install flash-attn==2.8.3 --no-build-isolation
#
# 2. Set environment variables:
#    export VLLM_ATTENTION_BACKEND=FLASH_ATTN
#    export VLLM_USE_TRITON_FLASH_ATTN=0
